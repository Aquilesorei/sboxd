name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux (statically linked musl — works on any glibc version)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: sbox-linux-x86_64
            binary: sbox
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: sbox-linux-aarch64
            binary: sbox
          # macOS (native runners — no cross-compilation needed)
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: sbox-macos-x86_64
            binary: sbox
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: sbox-macos-aarch64
            binary: sbox
          # Windows (MSVC — matches Docker Desktop / standard Windows dev setup)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: sbox-windows-x86_64.exe
            binary: sbox.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools

      - name: Install cross (Linux aarch64 musl)
        # `cross` provides an aarch64-musl Docker image so the binary is truly
        # statically linked against musl, not glibc.
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (aarch64 musl via cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" "${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: sbox-*
          generate_release_notes: true

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute SHA256 hashes
        id: sha
        run: |
          echo "arm=$(sha256sum sbox-macos-aarch64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "intel=$(sha256sum sbox-macos-x86_64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-sbox tap
        uses: actions/checkout@v4
        with:
          repository: Aquilesorei/homebrew-sbox
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-sbox

      - name: Update formula
        env:
          VERSION: ${{ github.ref_name }}   # e.g. v0.1.9
          SHA_ARM: ${{ steps.sha.outputs.arm }}
          SHA_INTEL: ${{ steps.sha.outputs.intel }}
        run: |
          VERSION_NUM="${VERSION#v}"         # strip leading 'v' → 0.1.9
          cat > homebrew-sbox/Formula/sbox.rb <<EOF
          class Sbox < Formula
            desc "Policy-driven sandboxed command runner"
            homepage "https://github.com/Aquilesorei/sboxd"
            version "${VERSION_NUM}"

            on_macos do
              on_arm do
                url "https://github.com/Aquilesorei/sboxd/releases/download/${VERSION}/sbox-macos-aarch64"
                sha256 "${SHA_ARM}"
              end
              on_intel do
                url "https://github.com/Aquilesorei/sboxd/releases/download/${VERSION}/sbox-macos-x86_64"
                sha256 "${SHA_INTEL}"
              end
            end

            def install
              bin.install Dir["sbox-macos-*"].first => "sbox"
            end

            test do
              system "\#{bin}/sbox", "--version"
            end
          end
          EOF

      - name: Commit and push
        working-directory: homebrew-sbox
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sbox.rb
          git commit -m "sbox ${VERSION}"
          git push

  publish-crate:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
