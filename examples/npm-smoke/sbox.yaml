version: 1

runtime:
  backend: podman
  rootless: true
  reuse_container: false

workspace:
  root: ../..
  mount: /workspace
  writable: false
  writable_paths:
    - node_modules
  exclude_paths:
    - .env
    - .env.local
    - .env.production
    - .env.development
    - "*.pem"
    - "*.key"
    - .npmrc
    - .netrc

image:
  ref: node:22-bookworm-slim
  digest: sha256:3efebb4f5f2952af4c86fe443a4e219129cc36f90e93d1ea2c4aa6cf65bdecf2

environment:
  set:
    npm_config_cache: /var/tmp/sbox/npm-cache
    npm_config_prefix: /var/tmp/sbox/npm-prefix
  deny:
    - NPM_TOKEN
    - NODE_AUTH_TOKEN

caches:
  - name: npm-cache
    target: /var/tmp/sbox/npm-cache
  - name: npm-prefix
    target: /var/tmp/sbox/npm-prefix
  - name: npm-artifacts
    target: /var/tmp/sbox/npm-artifacts

profiles:
  install:
    mode: sandbox
    network: on
    writable: true
    role: install
    require_pinned_image: true
    lockfile_files:
      - package-lock.json
      - npm-shrinkwrap.json
    pre_run:
      - npm audit --audit-level=high
    network_allow:
      - registry.npmjs.org
      - registry.yarnpkg.com
    ports: []
    no_new_privileges: true

  default:
    mode: sandbox
    network: off
    writable: true
    ports: []
    no_new_privileges: true

dispatch:
  npm-pack:
    match:
      - npm pack --pack-destination /var/tmp/sbox/npm-artifacts
    profile: default
  npm-install:
    match:
      - npm install --global /var/tmp/sbox/npm-artifacts/npm-smoke-0.1.0.tgz
    profile: install
  npm-run:
    match:
      - /var/tmp/sbox/npm-prefix/bin/npm-smoke
    profile: default
