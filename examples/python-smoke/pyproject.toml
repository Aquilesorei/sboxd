[project]
name = "python-smoke"
version = "0.1.0"
description = "sbox uv smoke project"
requires-python = ">=3.13"
dependencies = [
  "rich>=14.0.0,<15.0.0",
]

[project.scripts]
python-smoke = "python_smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_smoke"]
