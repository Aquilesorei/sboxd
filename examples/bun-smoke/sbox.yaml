version: 1

runtime:
  backend: podman
  rootless: true
  reuse_container: false

workspace:
  root: ../..
  mount: /workspace
  writable: false
  writable_paths:
    - node_modules
  exclude_paths:
    - .env
    - .env.local
    - .env.production
    - .env.development
    - "*.pem"
    - "*.key"
    - .npmrc
    - .netrc

image:
  ref: oven/bun:1.2.16

environment:
  set:
    BUN_INSTALL_CACHE_DIR: /var/tmp/sbox/bun-cache
  deny:
    - NPM_TOKEN
    - NODE_AUTH_TOKEN

caches:
  - name: bun-cache
    target: /var/tmp/sbox/bun-cache

profiles:
  install:
    mode: sandbox
    network: on
    writable: true
    role: install
    require_lockfile: true
    lockfile_files:
      - bun.lock
      - bun.lockb
    pre_run:
      - bun audit
    ports: []
    no_new_privileges: true

  default:
    mode: sandbox
    network: off
    writable: true
    ports: []
    no_new_privileges: true

dispatch:
  bun-install:
    match:
      - bun install --ignore-scripts
    profile: install
  bun-run:
    match:
      - bun run src/index.ts
    profile: default
