services:
  app:
    image: node:22-bookworm-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: node index.js
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
